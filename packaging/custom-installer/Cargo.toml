[package]
name = "xyn-installer"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
winreg = "0.55"
rfd = { version = "0.17", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm"] }

[build-dependencies]
winresource = "0.1"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
